services:
  - type: web
    name: joi-ai-companion
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PORT
        value: 8080
      - key: TZ
        value: Asia/Kolkata
      - key: USER_TIMEZONE
        value: Asia/Kolkata
      - key: GEMINI_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_USER_ID
        sync: false
